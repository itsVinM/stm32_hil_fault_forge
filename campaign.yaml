# faultforge campaign configuration
# All parameters are optional; defaults shown.

campaign:
  seed: 42              # RNG seed (deterministic replay)
  packets: 1500         # Number of sensor frames to emit
  cadence_ms: 5         # Packet interval in ms
  profile: "fuzz"       # clean | fuzz | emi | stress | delay | custom

# Custom fault weights (used when profile: "custom")
# Order: bitflip, byte, drop, delay, replay, burst, duty
weights:
  - 8
  - 8
  - 8
  - 8
  - 8
  - 8
  - 0

# Host connection
host:
  port: "auto"          # Serial port ("simulate" runs in-process; otherwise auto-detects ttyUSB/usbmodem/ttyACM/cu.)

# Output
report:
  quiet: false