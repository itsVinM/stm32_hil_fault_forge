[package]
name = "faultforge-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "faultforge"
path = "src/main.rs"

[dependencies]
faultforge-shared = { path = "../shared" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "signal"] }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"